# ১) রিপো ক্লোন বা রিপো ডিরেক্টরিতে প্রবেশ
git checkout -b feature/add-ci-and-docker

# ২) Create workflow file
cat > .github/workflows/lint.yml <<'YML'
name: lint

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on scripts
        run: |
          shellcheck -x install.sh || true
          shellcheck -x tools/run_scans.sh || true

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: |
          markdownlint README.md || true
          markdownlint CONTRIBUTING.md RULES_OF_ENGAGEMENT.md || true
YML

# ৩) Create docs/CONTAINERS.md
mkdir -p docs
